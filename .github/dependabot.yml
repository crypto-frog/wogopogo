version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '16:00'
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '16:15'
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automation

