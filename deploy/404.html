    <!-- Set the theme before first paint so there is no flash -->
    <script>
      try {
        var t = localStorage.getItem('wogo-theme')
        var c = localStorage.getItem('wogo-tint')
        var allowedTints = ['neutral', 'lake', 'cobalt', 'violet', 'rose', 'ember', 'forest']
        var tint = allowedTints.indexOf(c) >= 0 ? c : 'neutral'
        var darkChrome = {
          neutral: '#111318', lake: '#101918', cobalt: '#111721', violet: '#16141E',
          rose: '#1B1418', ember: '#1A1612', forest: '#111914'
        }
        var lightChrome = {
          neutral: '#EEEDE9', lake: '#EDEFEC', cobalt: '#EDEFF1', violet: '#F0EEF1',
          rose: '#F1EDEF', ember: '#F1EFEC', forest: '#EDEFED'
        }
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.tint = tint
        document.querySelector('meta[name="theme-color"]').content =
          t === 'light' ? lightChrome[tint] : darkChrome[tint]
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.dataset.tint = 'neutral'
      }
